name: RLS probe (read-only)
on:
  push:
    branches: [claude/rls-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Scoreboard table check (read-only; prints only status, counts, yes/no)
        run: |
          R=https://chfzvfyigycpkcsxbscu.supabase.co/rest/v1/glep_scoreboard
          K=sb_publishable_0zmkCJDMk_qAex_bnopfsA_CQP21oxN
          code=$(curl -s -o /tmp/b -w '%{http_code}' -H "apikey: $K" "$R?select=winner,margin,played_on")
          echo "::notice::glep_scoreboard read -> HTTP $code"
          if [ "$code" = 200 ]; then
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/b'))
          want={('kim mom og',20),('francesca',25),('jordan',28)}
          got={(r['winner'].strip().lower(),r['margin']) for r in d}
          print(f"::notice::rows: {len(d)}; expected 3 games present: {want<=got}; all dated 2026-11-09: {all(r['played_on']=='2026-11-09' for r in d)}")
          PY
          fi
